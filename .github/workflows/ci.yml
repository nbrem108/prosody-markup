name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv build
      - run: uv run prosody-markup assign examples/tier1-input.json --format markdown
