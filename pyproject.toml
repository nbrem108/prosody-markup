[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosody-markup"
version = "0.1.0.dev0"
description = "An open, testable convention for rendering measurable prosody in text"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Prosody Markup contributors" }]
keywords = ["prosody", "speech", "transcription", "accessibility", "linguistics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
prosody-markup = "prosody_markup.cli:main"

[project.urls]
Repository = "https://github.com/nbrem108/prosody-markup"
Issues = "https://github.com/nbrem108/prosody-markup/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prosody_markup"]

[tool.hatch.build.targets.wheel.force-include]
"legend/tier1.yaml" = "prosody_markup/data/tier1.yaml"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prosody_markup"]
